<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;color:#213749}button,input,textarea{font:inherit}button{cursor:pointer}.chat{height:100dvh;display:flex;flex-direction:column;background:#fff;border:1px solid #dcebe4;border-radius:20px;overflow:hidden;box-shadow:0 18px 55px #102d2933}.header{background:linear-gradient(120deg,#102f39,#1a6b52);color:white;padding:19px;display:flex;justify-content:space-between;align-items:center}.header strong{display:block;font-size:16px;letter-spacing:-.02em}.header small{display:flex;align-items:center;gap:6px;color:#bfe8d8;font-size:12px}.header small:before{content:"";height:7px;width:7px;background:#7be1b7;border-radius:50%}.header button{display:grid;place-items:center;width:34px;height:34px;background:#ffffff12;border:1px solid #ffffff38;color:white;border-radius:11px;font-size:19px}.messages{flex:1;overflow:auto;padding:20px 16px;background:#f5f9f7}.message{max-width:90%;padding:12px 14px;margin:10px 0;border-radius:4px 16px 16px;background:#fff;border:1px solid #e6efeb;box-shadow:0 3px 12px #193a2c08;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{margin-left:auto;background:#dff7ec;border-color:#d1f1e1;border-radius:16px 4px 16px 16px}.message small{display:block;color:#7e9689;margin-bottom:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.controls{padding:15px 16px 13px;border-top:1px solid #edf2ef}.controls form{display:flex;gap:8px}.controls input{flex:1;min-width:0}.controls input,.lead input,.lead textarea{border:1px solid #d9e6df;border-radius:11px;padding:11px 12px;width:100%;background:#fbfdfc;outline:none}.controls input:focus,.lead input:focus,.lead textarea:focus{border-color:#34b78d;box-shadow:0 0 0 3px #34b78d20}.primary{background:linear-gradient(135deg,#29b98a,#168b6a);color:#fff;border:0;border-radius:10px;padding:10px 15px;font-weight:700;box-shadow:0 5px 12px #159f7330}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.links button{border:0;background:#eff8f3;color:#188463;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600}.lead{padding:18px;display:grid;gap:10px;max-height:65vh;overflow:auto;background:#fff}.lead strong{font-size:16px}.lead label{display:grid;gap:5px;font-size:12px;font-weight:600;color:#5b7168}.lead textarea{resize:vertical;min-height:68px}.lead #closeLead{border:0;background:none;color:#477668;padding:6px;font-weight:600}.notice{padding:0 16px;color:#a63838;font-size:12px}.notice:not(:empty){padding-top:8px}.hidden{display:none!important}.collapsed{height:60px;width:150px;margin-left:auto;border-radius:30px}.collapsed .header{height:60px;justify-content:center;padding:0 14px}.collapsed .header small,.collapsed .messages,.collapsed .controls,.collapsed .lead,.collapsed .notice,.collapsed .title{display:none}.collapsed .header button{width:auto;height:auto;border:0;background:transparent;font-size:0}.collapsed .header button:after{content:'Open chat';font-size:14px;font-weight:700}
</style></head><body><div class="chat" id="chat"><div class="header"><div class="title"><strong id="title">Chat with us</strong><small>We’re here to help</small></div><button id="toggle" aria-label="Toggle chat">−</button></div><div class="messages" id="messages"><div class="message">Hi! How can we help you today?</div></div><div class="notice" role="alert" id="notice"></div><form class="lead hidden" id="lead"><strong>Tell us about your enquiry</strong><label>Name<input name="name" required maxlength="200"></label><label>Email<input name="email" type="email" required></label><label>What do you need?<textarea name="enquiry" required maxlength="4000"></textarea></label><label>Budget (optional)<input name="budget" maxlength="200"></label><label>Timeline (optional)<input name="timeline" maxlength="200"></label><button class="primary">Send enquiry</button><button type="button" id="closeLead">Back to chat</button></form><div class="controls"><form id="send"><input name="message" aria-label="Message" placeholder="Type your message…" required maxlength="4000"><button class="primary">Send</button></form><div class="links"><button type="button" id="openLead">Send an enquiry</button><button type="button" id="handoff">Talk to a person</button></div></div></div>
<script>
(function(){'use strict';const params=new URLSearchParams(location.search),site=params.get('site');let api;try{api=new URL(params.get('api')||location.origin);if(!['http:','https:'].includes(api.protocol))throw Error();}catch{return;}const root=api.origin+'/api/v1/public/inbound/'+encodeURIComponent(site||'');const key='visitor:'+site+':'+api.origin;let token=sessionStorage.getItem(key);let busy=false;const $=id=>document.getElementById(id);function error(message){$('notice').textContent=message||''}async function call(path,options={}){const headers=new Headers(options.headers||{});if(token)headers.set('Authorization','Bearer '+token);if(options.body)headers.set('Content-Type','application/json');const r=await fetch(root+path,{...options,headers});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Unable to complete request');return data;}async function start(){if(!token){const result=await call('/sessions',{method:'POST'});token=result.token;sessionStorage.setItem(key,token);}}async function load(){if(!token)return;const data=await call('/messages');const container=$('messages');container.replaceChildren();if(!data.messages.length){const intro=document.createElement('div');intro.className='message';intro.textContent='Hi! How can we help you today?';container.append(intro);}for(const m of data.messages){const div=document.createElement('div');div.className='message '+m.role;const label=document.createElement('small');label.textContent=m.role==='user'?'You':m.role==='staff'?'Team':'Assistant';div.append(label,document.createTextNode(m.content));container.append(div);}container.scrollTop=container.scrollHeight;}async function task(fn){if(busy)return;busy=true;error('');try{await start();await fn();await load();}catch(e){error(e.message||'Please try again.');}finally{busy=false;}}$('send').onsubmit=e=>{e.preventDefault();const input=e.currentTarget.elements.message;const text=input.value.trim();if(!text)return;task(async()=>{await call('/messages',{method:'POST',body:JSON.stringify({message:text})});input.value='';});};$('lead').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.currentTarget));task(async()=>{const r=await call('/lead',{method:'POST',body:JSON.stringify(values)});$('lead').classList.add('hidden');alert(r.message);});};$('handoff').onclick=()=>task(async()=>{const r=await call('/handoff',{method:'POST'});alert(r.message);});$('openLead').onclick=()=>$('lead').classList.remove('hidden');$('closeLead').onclick=()=>$('lead').classList.add('hidden');$('toggle').onclick=()=>{const collapsed=$('chat').classList.toggle('collapsed');parent.postMessage({type:'ai-employee-widget-size',collapsed},'*');};call('/config').then(data=>{$('title').textContent=data.name}).catch(e=>error(e.message));if(token)load().catch(()=>{sessionStorage.removeItem(key);token=null});setInterval(()=>{if(token&&!busy)load().catch(()=>{});},10000);})();
</script></body></html>
